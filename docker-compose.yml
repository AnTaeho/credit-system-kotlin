# 로컬 개발 인프라 — MySQL 과 Redis 만 띄운다.
#
# 기본 사용법은 "인프라는 컨테이너, 앱은 호스트"다. 앱을 IDE 나 ./gradlew bootRun 으로
# 띄우면 application.yml 의 기본값(localhost:3306 / localhost:6379, credit_system,
# credit/credit)이 그대로 맞는다. 컨테이너 안의 값과 그 기본값은 같은 계약이다.
#
#   docker compose up -d                  # MySQL + Redis
#   ./gradlew bootRun                     # 앱은 호스트에서
#   docker compose down -v                # 데이터까지 버리고 내리기
#
# 앱까지 컨테이너로 확인하고 싶으면 profile 을 켠다. 이때는 호스트명이 달라지므로
# Spring 표준 환경변수로 덮어쓴다 — application.yml 은 건드리지 않는다.
#
#   docker compose --profile app up -d --build
#
# 관측 스택(Prometheus/Grafana 포함)은 별도다: deploy/observability/docker-compose.yml

services:

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: credit_system
      MYSQL_USER: credit
      MYSQL_PASSWORD: credit
    # log-bin-trust-function-creators 는 V6(원장 append-only 트리거) 때문에 켠다.
    # 이 이미지는 log_bin=1 이고 마이그레이션을 도는 `credit` 계정에는 SUPER 가 없어서,
    # 기본값에서는 CREATE TRIGGER 가 ERROR 1419 로 막힌다(`docs/SYSTEM.md` 8절 "배포를 막는 것").
    # 운영 DB 서버의 같은 설정은 배포 체크리스트 항목이고 여기서 다루지 않는다.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log-bin-trust-function-creators=1
    ports:
      # 관측 스택과 달리 여기서는 publish 한다. 호스트의 앱이 붙어야 하기 때문이다.
      # 로컬에 이미 MySQL 이 3306 을 쓰고 있으면 그쪽을 내리거나 이 줄을 바꿔라.
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    # 기본 up 에는 안 뜬다. --profile app 을 줘야 뜬다.
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/credit_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: credit
      SPRING_DATASOURCE_PASSWORD: credit
      SPRING_DATA_REDIS_HOST: redis
      # 개발 로그인(X-Dev-User)과 예시 허용 목록. application-local.yml 참고.
      SPRING_PROFILES_ACTIVE: local
      # 관리 포트를 애플리케이션 포트에서 떼어낸다(step7 4단계와 같은 경계).
      MANAGEMENT_SERVER_PORT: 8081
    ports:
      - "8080:8080"
    # 도커는 SIGTERM 을 보낸 뒤 기본 10초만 기다리고 SIGKILL 한다. 그 기본값으로는 워커
    # 드레인(GenerationWorkerLifecycle)이 상한 60초(app.processing.timeout-seconds)를
    # 다 쓰기 전에 잘려, 진행 중이던 job 이 완료가 아니라 회수 경로로 넘어간다.
    # 60초(드레인) + 웹 graceful shutdown phase 와 부팅 뒷정리 여유 30초 = 90초.
    stop_grace_period: 90s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
