# 로컬 MySQL·Redis는 docker compose up -d로, 앱 포함 시 --profile app up -d --build로 실행한다(관측 스택: deploy/observability/docker-compose.yml).

services:

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: credit_system
      MYSQL_USER: credit
      MYSQL_PASSWORD: credit
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      # 호스트 앱 접속용 3306 포트이며, 로컬 MySQL과 충돌하면 포트를 변경한다.
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    # --profile app을 지정할 때만 실행한다.
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/credit_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: credit
      SPRING_DATASOURCE_PASSWORD: credit
      SPRING_DATA_REDIS_HOST: redis
      # local 프로필은 관리 포트를 8081 로 뗀다(application-local.yml). 시드 계정은 마이그레이션 V2 가 넣는다.
      SPRING_PROFILES_ACTIVE: local
      # 관리 포트를 애플리케이션 포트에서 떼어낸다.
      MANAGEMENT_SERVER_PORT: 8081
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
