# 기존 설계 결정과 충돌하는 규칙은 끄고 미사용 코드만 탐지한다(report.md J절).

comments:
  active: false
complexity:
  active: false
coroutines:
  active: false
empty-blocks:
  active: false
exceptions:
  active: false
naming:
  active: false
performance:
  active: false
potential-bugs:
  active: false

style:
  active: true

  # 켜는 것 — 미사용 코드
  UnusedImports:
    active: true      # 기본 비활성인 미사용 임포트 탐지를 활성화한다
  UnusedParameter:
    active: true
  UnusedPrivateClass:
    active: true
  UnusedPrivateMember:
    active: true
  UnusedPrivateProperty:
    active: true

  # 끄는 것 — 이미 확정한 결정과 충돌한다
  MagicNumber:
    active: false     # 검증 상한값(100자, 1000자)은 쓰이는 자리에 두는 편이 읽기 낫다
  LoopWithTooManyJumpStatements:
    active: false     # IdempotencyKeyCleanupTask 의 break 2개는 의도적이다
  UseCheckOrError:
    active: false     # F-5 에서 확정: lastFailure ?: IllegalStateException 유지
  ReturnCount:
    active: false     # JobAttempt.parse의 이른 반환(H-6)과 HeartbeatRegistry의 Redis 장애 유예 가드를 유지한다.
  ThrowsCount:
    active: false     # validateRequest의 검증을 유지한다(require는 IllegalArgumentException을 던지므로 제외, H-6).
