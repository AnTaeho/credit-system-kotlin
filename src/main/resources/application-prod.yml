spring:
  # 기본값을 일부러 주지 않는다. 플레이스홀더에 `:기본값` 을 붙이면 환경변수를 빠뜨렸을 때
  # 앱이 로컬 개발용 DB 를 향해 조용히 뜬다. 운영에서 그건 장애를 늦게 발견하게 만들 뿐이라,
  # 값이 없으면 부팅 단계에서 죽는 쪽을 택했다.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
  jpa:
    hibernate:
      # 운영에서 Hibernate 가 스키마를 건드리는 일은 없어야 한다. 명시해서 못 박는다.
      ddl-auto: validate

server:
  servlet:
    session:
      cookie:
        secure: true

logging:
  # 운영 로그만 JSON 으로 낸다. 로컬·테스트는 사람이 읽는 평문 그대로 둔다 — 개발 중에 한 줄씩
  # JSON 을 눈으로 파싱하는 것은 순손해다. 별도 인코더 의존성(logstash-logback-encoder 등)은 넣지 않는다.
  # 부트 자체가 ecs/logstash/gelf 세 형식을 들고 있고, 우리는 ECS 를 쓴다.
  # MDC 는 ECS 포맷터가 최상위 필드로 펼친다(requestId/jobId/attemptNo 가 각각 JSON 키가 된다).
  structured:
    format:
      console: ecs
