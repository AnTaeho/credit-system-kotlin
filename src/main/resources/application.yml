spring:
  application:
    name: credit_system
  # 여기 적힌 값은 로컬 개발용 기본값이다. 루트 docker-compose 가 띄우는 DB 와 같은 계약
  # (credit_system / credit / credit)을 쓴다. 다른 환경에서는 Spring 표준 환경변수
  # (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD)로 덮어쓴다.
  datasource:
    url: jdbc:mysql://localhost:3306/credit_system
    username: credit
    password: credit
  flyway:
    enabled: true
  jpa:
    hibernate:
      # 스키마는 Flyway 마이그레이션이 만든다. Hibernate 는 맞는지 확인만 한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
      connect-timeout: 2s
  task:
    scheduling:
      pool:
        size: 4
  lifecycle:
    # 종료 phase 하나가 매달릴 수 있는 상한. 임의의 숫자가 아니라 진행 중 job 의 처리 상한과
    # 같은 값에서 유도한다 — 그 시간을 넘긴 PROCESSING job 은 어차피 DeadJobRecoveryTask 의
    # 회수 대상이라 더 기다려서 얻을 것이 없다. GenerationWorkerLifecycle 의 드레인 상한도
    # 같은 프로퍼티를 읽으므로 두 값이 어긋날 자리가 없다.
    timeout-per-shutdown-phase: ${app.processing.timeout-seconds:60}s

app:
  scheduling:
    enabled: true
    reconciliation-interval-millis: 60000
    snapshot-interval-millis: 15000
    idempotency-cleanup-cron: "0 0 2 * * *"
    timezone: Asia/Seoul
  idempotency:
    retention-days: 7
  worker:
    enabled: true
    batch-size: 3
    concurrency: 3
  generation:
    cost: 100
    max-attempts: 3
  stub:
    failure-rate: 0.3
    min-delay-millis: 3000
    max-delay-millis: 7000
  heartbeat:
    timeout-seconds: 10
    refresh-interval-seconds: 5
  processing:
    timeout-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: credit_system

logging:
  level:
    com.example.credit_system_kotlin: info

server:
  # SIGTERM 이 오면 새 요청 접수를 멈추고 진행 중 요청을 끝낸 뒤 내려간다. 이 설정이 없으면
  # 웹서버가 즉시 끊겨, 응답을 기다리던 hold 요청이 "돈은 묶였는데 jobId 는 못 받은" 상태로
  # 남는다. 워커 드레인은 이보다 뒤 phase 에서 돌므로, HTTP 유입이 끊긴 뒤에 시작된다.
  shutdown: graceful
