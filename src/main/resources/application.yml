spring:
  application:
    name: credit_system
  autoconfigure:
    # users 테이블을 사용하므로 기본 메모리 사용자 생성과 임시 비밀번호 로깅을 비활성화한다.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  # 루트 Compose와 같은 로컬 DB 기본값이며, 다른 환경은 SPRING_DATASOURCE_* 환경변수로 덮어쓴다.
  datasource:
    url: jdbc:mysql://localhost:3306/credit_system
    username: credit
    password: credit
  flyway:
    enabled: true
  jpa:
    hibernate:
      # 스키마는 Flyway 마이그레이션이 만든다. Hibernate 는 맞는지 확인만 한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
      connect-timeout: 2s
  task:
    scheduling:
      pool:
        size: 4

app:
  auth:
    # HTTPS 사용 시 로그인·CSRF 쿠키에 Secure를 설정한다.
    cookie-secure: false
    jwt:
      # HS256 서명 키는 32바이트 이상이며, 기본값은 로컬 전용이다.
      secret: ${APP_AUTH_JWT_SECRET:local-only-jwt-secret-for-development}
      issuer: credit
      access-ttl: 1h
      refresh-ttl: 14d
  scheduling:
    enabled: true
    reconciliation-interval-millis: 60000
    snapshot-interval-millis: 15000
    idempotency-cleanup-cron: "0 0 2 * * *"
    timezone: Asia/Seoul
  idempotency:
    retention-days: 7
  admin:
    # 운영자 지급(POST /api/admin/users/{userId}/grants) 1회 상한.
    max-grant-amount: 1000000
  worker:
    enabled: true
    # 처리량은 concurrency ÷ 5 건/초쯤 나온다. batch-size 는 concurrency ÷ 10 보다 작으면 워커가 논다.
    batch-size: 5
    concurrency: 20
  generation:
    cost: 100
    max-attempts: 3
  stub:
    failure-rate: 0.3
    min-delay-millis: 3000
    max-delay-millis: 7000
  heartbeat:
    timeout-seconds: 10
    refresh-interval-seconds: 5
  processing:
    timeout-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: credit_system

logging:
  level:
    com.example.credit_system_kotlin: info

server:
  # SIGTERM 시 진행 중 요청의 응답을 마친 뒤 종료해 hold 결과 유실을 방지한다.
  shutdown: graceful
