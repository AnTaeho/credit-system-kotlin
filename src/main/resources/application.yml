spring:
  application:
    name: credit_system
  # 여기 적힌 값은 로컬 개발용 기본값이다. 루트 docker-compose 가 띄우는 DB 와 같은 계약
  # (credit_system / credit / credit)을 쓴다. 다른 환경에서는 Spring 표준 환경변수
  # (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD)로 덮어쓴다.
  datasource:
    url: jdbc:mysql://localhost:3306/credit_system
    username: credit
    password: credit
  flyway:
    enabled: true
  jpa:
    hibernate:
      # 스키마는 Flyway 마이그레이션이 만든다. Hibernate 는 맞는지 확인만 한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
      connect-timeout: 2s
  task:
    scheduling:
      pool:
        size: 4

app:
  scheduling:
    enabled: true
    reconciliation-interval-millis: 60000
    snapshot-interval-millis: 15000
    idempotency-cleanup-cron: "0 0 2 * * *"
    timezone: Asia/Seoul
  idempotency:
    retention-days: 7
  worker:
    enabled: true
    batch-size: 3
    concurrency: 3
  generation:
    cost: 100
    max-attempts: 3
  stub:
    failure-rate: 0.3
    min-delay-millis: 3000
    max-delay-millis: 7000
  heartbeat:
    timeout-seconds: 10
    refresh-interval-seconds: 5
  processing:
    timeout-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: credit_system

logging:
  level:
    com.example.credit_system_kotlin: info
