spring:
  application:
    name: credit_system
  # 여기 적힌 값은 로컬 개발용 기본값이다. 루트 docker-compose 가 띄우는 DB 와 같은 계약
  # (credit_system / credit / credit)을 쓴다. 다른 환경에서는 Spring 표준 환경변수
  # (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD)로 덮어쓴다.
  datasource:
    url: jdbc:mysql://localhost:3306/credit_system
    username: credit
    password: credit
  flyway:
    enabled: true
  jpa:
    hibernate:
      # 스키마는 Flyway 마이그레이션이 만든다. Hibernate 는 맞는지 확인만 한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
      connect-timeout: 2s
  security:
    oauth2:
      client:
        registration:
          google:
            # 로컬 기본값은 자리표시다. 자격증명 없이도 앱은 뜨고, 구글 로그인만 실패한다.
            # 로컬에서는 개발 로그인(application-local.yml)을 쓴다. 운영은 application-prod.yml 이
            # 기본값 없이 덮어써서 값이 없으면 부팅에서 죽는다.
            client-id: ${GOOGLE_CLIENT_ID:local-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-placeholder}
            scope: openid,email,profile
  task:
    scheduling:
      pool:
        size: 4
  lifecycle:
    # 종료 phase 하나가 매달릴 수 있는 상한. 임의의 숫자가 아니라 진행 중 job 의 처리 상한과
    # 같은 값에서 유도한다 — 그 시간을 넘긴 PROCESSING job 은 어차피 DeadJobRecoveryTask 의
    # 회수 대상이라 더 기다려서 얻을 것이 없다. GenerationWorkerLifecycle 의 드레인 상한도
    # 같은 프로퍼티를 읽으므로 두 값이 어긋날 자리가 없다.
    timeout-per-shutdown-phase: ${app.processing.timeout-seconds:60}s

app:
  auth:
    # 로그인을 허용할 이메일(대소문자 무시). 운영자 목록은 반드시 허용 목록의 부분집합이어야 한다.
    # 기본은 비어 있다 — 아무도 못 들어온다. 운영은 환경변수로 채운다. 속성의 대시는 빠지므로 APP_AUTH_ALLOWEDEMAILS=a@x.com,b@y.com, APP_AUTH_ADMINEMAILS 처럼 쓴다.
    allowed-emails: []
    admin-emails: []
    dev-login:
      # 헤더 한 줄로 로그인하는 로컬 전용 장치. 기본은 끈다. prod 에서 켜면 기동이 거부된다.
      enabled: false
  scheduling:
    enabled: true
    reconciliation-interval-millis: 60000
    snapshot-interval-millis: 15000
    idempotency-cleanup-cron: "0 0 2 * * *"
    timezone: Asia/Seoul
  idempotency:
    retention-days: 7
  admin:
    # 운영자 지급(POST /api/admin/users/{userId}/grants) 1회 상한.
    max-grant-amount: 1000000
  worker:
    enabled: true
    batch-size: 3
    concurrency: 3
  generation:
    cost: 100
    max-attempts: 3
    # 외부 생성 한 번을 기다려 주는 상한. 이 상한을 지키는 주체는 생성 클라이언트 구현이다.
    # 기본 지연(3~7초)보다 넉넉히 위에 둔다.
    timeout-seconds: 20
    # 재시도 사이의 대기. base * multiplier^(재시도 횟수 - 1) 이고 max-seconds 에서 자른다.
    # max-attempts 가 3 이라 실제로 쓰이는 값은 10초와 40초 두 번이다.
    retry-backoff:
      base-seconds: 10
      multiplier: 4
      max-seconds: 300
  stub:
    failure-rate: 0.3
    min-delay-millis: 3000
    max-delay-millis: 7000
    # 타임아웃조차 먹지 않는 "응답 없음"을 재현하는 장애 주입 손잡이. 기본은 꺼짐.
    hang: false
  heartbeat:
    timeout-seconds: 10
    refresh-interval-seconds: 5
  processing:
    # PROCESSING 정체 회수의 후보 선정 기준. 이보다 오래 PROCESSING 이면 스캔에 걸린다.
    timeout-seconds: 60
    # heartbeat 가 LIVE 여도 이만큼 지났으면 내린다. 멈춘 워커의 종지기는 영원히 갱신하므로
    # 이 상한이 없으면 돈이 held 에 영구히 묶인다. timeout-seconds 보다 반드시 커야 한다.
    absolute-timeout-seconds: 300

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: credit_system

logging:
  level:
    com.example.credit_system_kotlin: info

server:
  # SIGTERM 이 오면 새 요청 접수를 멈추고 진행 중 요청을 끝낸 뒤 내려간다. 이 설정이 없으면
  # 웹서버가 즉시 끊겨, 응답을 기다리던 hold 요청이 "돈은 묶였는데 jobId 는 못 받은" 상태로
  # 남는다. 워커 드레인은 이보다 뒤 phase 에서 돌므로, HTTP 유입이 끊긴 뒤에 시작된다.
  shutdown: graceful
  servlet:
    session:
      cookie:
        # 세션 쿠키가 곧 로그인이다. 스크립트가 읽지 못하게, 다른 사이트의 POST 에 따라가지 않게 한다.
        # Secure 는 HTTPS 인 운영에서만 켠다(application-prod.yml).
        http-only: true
        same-site: lax
