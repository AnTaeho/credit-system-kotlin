spring:
  application:
    name: credit_system
  # 여기 적힌 값은 로컬 개발용 기본값이다. 루트 docker-compose 가 띄우는 DB 와 같은 계약
  # (credit_system / credit / credit)을 쓴다. 다른 환경에서는 Spring 표준 환경변수
  # (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD)로 덮어쓴다.
  datasource:
    url: jdbc:mysql://localhost:3306/credit_system
    username: credit
    password: credit
  flyway:
    enabled: true
  jpa:
    hibernate:
      # 스키마는 Flyway 마이그레이션이 만든다. Hibernate 는 맞는지 확인만 한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
      connect-timeout: 2s
  security:
    oauth2:
      client:
        registration:
          google:
            # 로컬 기본값은 자리표시다. 자격증명 없이도 앱은 뜨고, 구글 로그인만 실패한다.
            # 로컬에서는 개발 로그인(application-local.yml)을 쓴다. 운영은 application-prod.yml 이
            # 기본값 없이 덮어써서 값이 없으면 부팅에서 죽는다.
            client-id: ${GOOGLE_CLIENT_ID:local-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-placeholder}
            scope: openid,email,profile
  task:
    scheduling:
      pool:
        size: 4

app:
  auth:
    # 로그인을 허용할 이메일(대소문자 무시). 운영자 목록은 반드시 허용 목록의 부분집합이어야 한다.
    # 기본은 비어 있다 — 아무도 못 들어온다. 운영은 환경변수로 채운다. 속성의 대시는 빠지므로 APP_AUTH_ALLOWEDEMAILS=a@x.com,b@y.com, APP_AUTH_ADMINEMAILS 처럼 쓴다.
    allowed-emails: []
    admin-emails: []
    dev-login:
      # 헤더 한 줄로 로그인하는 로컬 전용 장치. 기본은 끈다. prod 에서 켜면 기동이 거부된다.
      enabled: false
  scheduling:
    enabled: true
    reconciliation-interval-millis: 60000
    snapshot-interval-millis: 15000
    idempotency-cleanup-cron: "0 0 2 * * *"
    timezone: Asia/Seoul
  idempotency:
    retention-days: 7
  worker:
    enabled: true
    batch-size: 3
    concurrency: 3
  generation:
    cost: 100
    max-attempts: 3
  stub:
    failure-rate: 0.3
    min-delay-millis: 3000
    max-delay-millis: 7000
  heartbeat:
    timeout-seconds: 10
    refresh-interval-seconds: 5
  processing:
    timeout-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: credit_system

logging:
  level:
    com.example.credit_system_kotlin: info

server:
  # SIGTERM 이 오면 새 요청 접수를 멈추고 진행 중 요청을 끝낸 뒤 내려간다. 이 설정이 없으면
  # 웹서버가 즉시 끊겨, 응답을 기다리던 hold 요청이 "돈은 묶였는데 jobId 는 못 받은" 상태로
  # 남는다.
  shutdown: graceful
  servlet:
    session:
      cookie:
        # 세션 쿠키가 곧 로그인이다. 스크립트가 읽지 못하게, 다른 사이트의 POST 에 따라가지 않게 한다.
        # Secure 는 HTTPS 인 운영에서만 켠다(application-prod.yml).
        http-only: true
        same-site: lax
