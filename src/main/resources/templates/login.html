<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('로그인')}"></head>
<body>
<main class="narrow">
  <h1>credit</h1>

  <p class="notice error" th:if="${loginError}">이메일 또는 비밀번호가 맞지 않습니다.</p>
  <p class="notice" th:if="${loggedOut}">로그아웃했습니다.</p>
  <p class="notice" th:if="${expired}">로그인이 만료되었습니다. 다시 로그인하세요.</p>

  <form th:action="@{/login}" method="post">
    <label for="email">이메일</label>
    <input id="email" name="email" type="email" required autocomplete="username" th:value="${email}">
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button type="submit">로그인</button>
  </form>

  <p class="switch">계정이 없다면 <a th:href="@{/signup}">가입</a></p>
</main>
</body>
</html>
