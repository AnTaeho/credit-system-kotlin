<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('원장')}"></head>
<body>
<header th:replace="~{fragments :: topbar}"></header>
<main>
  <h2>원장</h2>
  <p>현재 잔액 <span th:text="${balance}">0</span> 크레딧</p>
  <table class="list">
    <thead>
    <tr><th>id</th><th>종류</th><th>금액</th><th>job</th><th>시각</th></tr>
    </thead>
    <tbody id="ledger-rows">
    <tr th:each="e : ${entries.items}">
      <td class="c-id" th:text="${e.id}">1</td>
      <td class="c-type" th:text="${e.type}">HOLD</td>
      <td class="c-amount" th:text="${e.amount}">100</td>
      <td class="c-job" th:text="${e.jobId} ?: '-'">-</td>
      <td class="c-created" th:text="${e.createdAt}">-</td>
    </tr>
    </tbody>
  </table>
  <p class="muted" th:if="${entries.items.isEmpty()}">원장 기록이 없습니다.</p>
  <button type="button" id="ledger-more" th:hidden="${entries.nextCursor == null}"
          th:attr="data-cursor=${entries.nextCursor}">더 보기</button>
  <p id="ledger-message" class="message" role="status"></p>

  <template id="ledger-row-template">
    <tr>
      <td class="c-id"></td>
      <td class="c-type"></td>
      <td class="c-amount"></td>
      <td class="c-job"></td>
      <td class="c-created"></td>
    </tr>
  </template>
</main>
<script th:src="@{/js/ledger.js}" defer></script>
</body>
</html>
