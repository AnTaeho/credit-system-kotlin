<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('가입')}"></head>
<body>
<main class="narrow">
  <h1>credit</h1>
  <h2>가입</h2>

  <p class="notice error" th:if="${signupError}" th:text="${signupError}">가입하지 못했습니다.</p>

  <form th:action="@{/signup}" method="post">
    <label for="email">이메일</label>
    <input id="email" name="email" type="email" required autocomplete="username" th:value="${email}">
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" required autocomplete="new-password">
    <p class="hint">8자 이상</p>
    <label for="passwordConfirm">비밀번호 확인</label>
    <input id="passwordConfirm" name="passwordConfirm" type="password" required autocomplete="new-password">
    <button type="submit">가입</button>
  </form>

  <p class="switch">이미 계정이 있다면 <a th:href="@{/login}">로그인</a></p>
</main>
</body>
</html>
