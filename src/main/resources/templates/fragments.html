<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  공통 조각. CSP 가 인라인 스크립트·스타일을 막으므로 style="" 속성, onclick, <script> 본문을 쓰지 않는다.
  서버 값은 th:text 로만 넣고(자동 이스케이프), JS 에 넘길 값은 data-* 속성으로 둔다.
-->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- fetch 가 CSRF 헤더를 싣는 근거. 9-B 는 세션 저장소라 쿠키(XSRF-TOKEN)가 없다. -->
  <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
  <title th:text="${title} + ' · credit'">credit</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<header class="topbar" th:fragment="topbar">
  <nav>
    <a th:href="@{/}">홈</a>
    <a th:href="@{/ledger}">원장</a>
    <a th:if="${admin}" th:href="@{/admin}">운영자 지급</a>
  </nav>
  <div class="who">
    <span th:text="${email}">user@example.com</span>
    <form th:action="@{/logout}" method="post" class="inline">
      <button type="submit" class="link">로그아웃</button>
    </form>
  </div>
</header>
</body>
</html>
