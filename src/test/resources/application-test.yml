spring:
  datasource:
    url: jdbc:h2:mem:credit_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      connection-timeout: 5000
  # 마이그레이션은 MySQL 문법으로 쓰여 있어서 H2 에서는 돌지 않는다. H2 를 쓰는 테스트는
  # 지금까지처럼 Hibernate 가 스키마를 만든다. 마이그레이션이 실제로 도는지는
  # Testcontainers MySQL 을 쓰는 테스트(SharedContainers)가 확인한다.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  scheduling:
    enabled: false
  idempotency:
    retention-days: 7
  worker:
    enabled: false
    batch-size: 3
    concurrency: 3
  generation:
    cost: 100
    max-attempts: 3
  stub:
    failure-rate: 0.0
    min-delay-millis: 0
    max-delay-millis: 0
  heartbeat:
    timeout-seconds: 10
    refresh-interval-seconds: 5
  processing:
    timeout-seconds: 60
