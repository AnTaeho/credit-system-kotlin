spring:
  datasource:
    url: jdbc:h2:mem:credit_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      connection-timeout: 5000
  # H2 스키마는 Hibernate로 생성하고, MySQL 전용 Flyway 마이그레이션은 SharedContainers 테스트로 검증한다.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  # 닫힌 포트다. H2 테스트가 개발 머신에 떠 있는 Redis(localhost:6379)에 쓰지 못하게 한다.
  # Redis 가 필요한 테스트는 SharedContainers 가 컨테이너 주소로 덮어쓴다.
  data:
    redis:
      port: 1

app:
  auth:
    jwt:
      secret: test-only-jwt-secret-0123456789-abcdef
  scheduling:
    enabled: false
  idempotency:
    retention-days: 7
  worker:
    enabled: false
    batch-size: 3
    concurrency: 3
  generation:
    cost: 100
    max-attempts: 3
  stub:
    failure-rate: 0.0
    min-delay-millis: 0
    max-delay-millis: 0
  heartbeat:
    timeout-seconds: 10
    refresh-interval-seconds: 5
  processing:
    timeout-seconds: 60
