# 기본 브랜치에 의존하는 workflow_run 대신 ci.yml 호출과 needs로 동일 커밋의 검증 통과 후 GHCR에 이미지를 푸시한다.
name: image

on:
  push:
    branches: [develop]
    tags: ['v*']

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ci.yml 검증을 통과해야 이미지를 빌드한다.
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    name: build & push to GHCR
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # develop은 develop·sha 태그, 버전은 전체·주부 버전·sha 태그를 생성하며 latest는 제외한다.
      - name: derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/antaeho/credit-system-kotlin
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # gha 캐시로 Dockerfile의 Gradle 의존성 레이어를 재사용한다.
          cache-from: type=gha
          cache-to: type=gha,mode=max
