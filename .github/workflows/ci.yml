# develop/main PR 및 image.yml의 workflow_call에서 test·detekt·ktlintCheck를 실행한다.
name: ci

on:
  pull_request:
    branches: [develop, main]
  workflow_call:

# 같은 브랜치의 새 커밋이 오면 이전 검증을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: test + detekt + ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 자동 프로비저닝이 없으므로 Gradle toolchain과 detekt에 필요한 JDK 17을 설치한다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 러너의 Docker로 Testcontainers(MySQL 8.4·Redis 7)를 실행하며 컨테이너는 재사용하지 않는다.
      - name: gradle test detekt ktlintCheck
        run: ./gradlew --no-daemon --console=plain test detekt ktlintCheck

      # 실패 원인 분석을 위해 테스트 리포트를 업로드한다.
      - name: upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/
            build/test-results/
          retention-days: 7
          if-no-files-found: warn
