global:
  # 장애 주입 곡선을 관찰하도록 5초마다 수집한다(스냅샷 15초, 운영 권장 15~30초).
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: credit_system
    metrics_path: /actuator/prometheus
    static_configs:
      # Compose 내부 전용 관리 포트 8081에서 수집한다.
      - targets: ["app:8081"]
