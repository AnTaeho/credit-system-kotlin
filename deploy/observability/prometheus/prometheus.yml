global:
  # 5초. 도메인 스냅샷 주기가 15초이므로 게이지 한 번당 3회쯤 긁힌다.
  # 프로덕션이라면 15~30초가 맞지만, 여기서는 장애 주입(6단계)의 곡선을 촘촘히 보려고 짧게 둔다.
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: credit_system
    metrics_path: /actuator/prometheus
    static_configs:
      # 8080 이 아니라 8081 이다. 관리 포트는 compose 네트워크 안에서만 보인다.
      - targets: ["app:8081"]
