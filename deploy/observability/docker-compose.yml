# MySQL·Redis·앱·Prometheus 관측 스택으로, 지표와 알람은 localhost:9090의 /graph·/alerts에서 확인한다.

services:

  mysql:
    image: mysql:8.4
    environment:
      # 루트 docker-compose.yml·application.yml 과 같은 계약이다.
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: credit_system
      MYSQL_USER: credit
      MYSQL_PASSWORD: credit
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # 로컬 MySQL과의 포트 충돌을 피하고 docker compose exec mysql로 디버깅한다.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    # 마찬가지로 publish 하지 않는다. 로컬 Redis(6379)와 충돌한다.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      # 루트 Dockerfile에서 bootJar까지 빌드하므로 호스트의 사전 빌드는 필요 없다.
      context: ../..
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/credit_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: credit
      SPRING_DATASOURCE_PASSWORD: credit
      SPRING_DATA_REDIS_HOST: redis
      # local 프로필은 관리 포트를 8081 로 뗀다(application-local.yml). 시드 계정은 마이그레이션 V2 가 넣는다.
      SPRING_PROFILES_ACTIVE: local
      # 애플리케이션 포트와 관리 포트를 분리한다.
      MANAGEMENT_SERVER_PORT: 8081
      # 장애 주입 설정의 기본값은 application.yml과 같으며, 스케줄러·워커 변경에는 재기동이 필요하다.
      APP_SCHEDULING_ENABLED: ${APP_SCHEDULING_ENABLED:-true}
      APP_WORKER_ENABLED: ${APP_WORKER_ENABLED:-true}
      APP_STUB_FAILURE_RATE: ${APP_STUB_FAILURE_RATE:-0.3}
      APP_STUB_MIN_DELAY_MILLIS: ${APP_STUB_MIN_DELAY_MILLIS:-3000}
      APP_STUB_MAX_DELAY_MILLIS: ${APP_STUB_MAX_DELAY_MILLIS:-7000}
    ports:
      # 8080만 공개하고 액추에이터는 내부 관리 포트 app:8081에서 Prometheus가 수집한다.
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 관리 포트 장애 시 컨테이너도 unhealthy로 판정한다(docs 5단계).
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    depends_on:
      - app
